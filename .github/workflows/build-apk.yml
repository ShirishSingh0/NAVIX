name: Build & Release NAVIX Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Direct Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk navix-companion.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navix-companion-apk
          path: navix-companion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "NAVIX Moto Companion APK"
          body: |
            ### 🏍️ NAVIX Moto Companion Android App

            Direct 1-click download for your Android phone.

            #### 📥 Download:
            Click **`navix-companion.apk`** below to download directly to your phone.
          files: |
            navix-companion.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
